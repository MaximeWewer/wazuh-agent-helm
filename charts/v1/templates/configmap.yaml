apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "wazuh-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "wazuh-agent.labels" . | nindent 4 }}
data:
  ossec.conf: |
    <ossec_config>
      <client>
        {{- include "wazuh-agent.serverBlocks" . | trim | nindent 8 }}
        <enrollment>
          <enabled>yes</enabled>
          <agent_name>${WAZUH_AGENT_NAME}</agent_name>
          <manager_address>${WAZUH_REGISTRATION_SERVER}</manager_address>
          <port>${WAZUH_REGISTRATION_PORT}</port>
          {{- with .Values.registration.groups }}
          <groups>{{ if kindIs "string" . }}{{ . }}{{ else }}{{ join "," . }}{{ end }}</groups>
          {{- end }}
          {{- with .Values.registration.sslCipher }}
          <ssl_cipher>{{ . }}</ssl_cipher>
          {{- end }}
        </enrollment>
        {{- with .Values.configProfile }}
        <config-profile>{{ if kindIs "string" . }}{{ . }}{{ else }}{{ join "," . }}{{ end }}</config-profile>
        {{- end }}
        <notify_time>{{ .Values.client.notifyTime }}</notify_time>
        <time-reconnect>{{ .Values.client.timeReconnect }}</time-reconnect>
        {{- with .Values.client.forceReconnectInterval }}
        <force_reconnect_interval>{{ . }}</force_reconnect_interval>
        {{- end }}
        <auto_restart>{{ ternary "yes" "no" .Values.client.autoRestart }}</auto_restart>
        <crypto_method>{{ .Values.client.cryptoMethod }}</crypto_method>
      </client>

      <client_buffer>
        <disabled>no</disabled>
        <queue_size>5000</queue_size>
        <events_per_second>500</events_per_second>
      </client_buffer>

      <logging>
        <log_format>plain</log_format>
      </logging>

      {{- if .Values.extraOssecConf }}
{{ .Values.extraOssecConf | indent 6 }}
      {{- end }}
      
    </ossec_config>

  local_internal_options.conf: |
    {{- .Values.localInternalOptions | nindent 4 }}
    {{- if .Values.extraLocalInternalOptions }}
{{ .Values.extraLocalInternalOptions | indent 4 }}
    {{- end }}
